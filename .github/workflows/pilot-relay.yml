name: Pilot relay image

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the relay without provider credentials
        run: docker build --pull -f deploy/relay.Dockerfile -t aural-pilot-relay:test .
      - name: Verify runtime imports and unprivileged user
        run: |
          test "$(docker run --rm --entrypoint id aural-pilot-relay:test -u)" != "0"
          docker run --rm --entrypoint node aural-pilot-relay:test --import tsx --input-type=module -e 'await import("ws"); await import("dotenv"); await import("./src/lib/logger.ts");'
      - name: Check configurable generator deployment
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" aural-pilot-relay:test node --import tsx --test tests/ai-generator-run.test.ts tests/openai-tts.test.ts

  video-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build video worker remotely
        run: docker build --pull -f deploy/video-worker.Dockerfile -t aural-video-worker:test .
      - name: Check runtime and FFmpeg
        run: |
          test "$(docker run --rm --entrypoint id aural-video-worker:test -u)" != "0"
          docker run --rm --entrypoint ffmpeg aural-video-worker:test -version
          docker run --rm --entrypoint node aural-video-worker:test --import tsx --input-type=module -e 'await import("@supabase/supabase-js"); await import("./src/lib/video/transport.ts");'
          if docker run --rm aural-video-worker:test; then echo "Worker must reject unconfigured database"; exit 1; fi
