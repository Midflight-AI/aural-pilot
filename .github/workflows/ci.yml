name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    # Pin the OS supported by the locked Playwright browser build.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependency security audit
        run: npm run audit:dependencies

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Video recovery spike tests
        run: node --import tsx --test tests/video-transport.test.ts tests/video-isolation.test.ts tests/video-processor-auth.test.ts tests/relay-ticket.test.ts

      - name: Test
        run: npm run test:web --if-present

      - name: Install functional-test browser
        run: npx playwright install --with-deps chromium

      - name: Functional product tests
        run: npm run test:functional
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_URL: https://build-placeholder.supabase.co
          SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          GEMINI_API_KEY: build-placeholder

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_URL: https://build-placeholder.supabase.co
          SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          GEMINI_API_KEY: build-placeholder

  video-database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-video-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Recording lifecycle and access regression tests
        run: psql -h 127.0.0.1 -U postgres -d postgres -f tests/video-spike.sql
        env:
          PGPASSWORD: disposable-video-ci
